name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  shared-domain:
    # The web repo carries a copy of app/src/domain. Compare against its branch of the
    # same name when there is one (a change made in both repos), otherwise its main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick the web repo's matching branch
        id: sibling
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if git ls-remote --exit-code --heads https://github.com/unamusedmon/becomewhoyouare-web.git "$branch" >/dev/null; then
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          repository: unamusedmon/becomewhoyouare-web
          ref: ${{ steps.sibling.outputs.ref }}
          path: sibling
      - run: node scripts/check-shared-domain.mjs app/src/domain sibling/src/domain
