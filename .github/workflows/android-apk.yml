name: Android APK
# Builds a sideloadable APK (arm64, debug-signed, not for the Play Store)
# and attaches it to a GitHub Release so it can be downloaded from a phone.
# Builds from main are regular releases; builds from PRs are pre-releases.
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/android-apk.yml']
  pull_request:
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    # Fork PRs get a read-only token and can't publish a release.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1
      - name: Build release APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          NODE_ENV: production
      - name: Name the APK
        id: apk
        run: |
          short=${SHA::7}
          name="become-who-you-are-${short}-arm64.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "../$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "short=$short" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}-${{ steps.apk.outputs.short }}
          target_commitish: ${{ env.SHA }}
          name: "${{ github.event_name == 'pull_request' && format('Test build from PR #{0}', github.event.pull_request.number) || format('Phone build {0}', steps.apk.outputs.short) }}"
          prerelease: ${{ github.event_name == 'pull_request' }}
          files: ${{ steps.apk.outputs.name }}
          body: |
            Sideload build of the phone app from ${{ env.SHA }}.
            arm64 only, signed with the debug key: not for the Play Store.
            On your phone: tap the .apk below, download, open, allow installs from your browser.
